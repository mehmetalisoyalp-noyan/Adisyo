# Adisyo siparişlerini 30 dakikada bir programa çeker.
# Gerekli depo sırları (Settings → Secrets and variables → Actions):
#   SITE_URL    → programın adresi, ör. https://adisyo-xxxx.vercel.app (sonunda / olmadan)
#   CRON_SECRET → Vercel'deki CRON_SECRET ile aynı değer
name: Adisyo eşitleme

on:
  schedule:
    - cron: "*/30 * * * *" # 30 dakikada bir (UTC); GitHub yoğunlukta birkaç dakika geciktirebilir
  workflow_dispatch: {} # Actions sekmesinden elle de çalıştırılabilir

permissions: {}

jobs:
  eslestir:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Eşitleme adresini çağır
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL veya CRON_SECRET tanımlı değil; atlanıyor."
            exit 0
          fi
          # Adres düzeltmeleri: boşluk, sondaki "/" ve http → https
          SITE_URL="$(echo "$SITE_URL" | tr -d '[:space:]')"
          SITE_URL="${SITE_URL%%/}"; SITE_URL="${SITE_URL%%/}"
          SITE_URL="${SITE_URL/#http:\/\//https://}"
          case "$SITE_URL" in https://*) ;; *) SITE_URL="https://$SITE_URL" ;; esac
          # -L: aynı sitedeki yönlendirmeleri izle (başlık yalnızca aynı adrese gönderilir)
          code=$(curl -sS -L -o cevap.json -w "%{http_code}" --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/adisyo")
          echo "HTTP $code"; cat cevap.json; echo
          test "$code" = "200"
